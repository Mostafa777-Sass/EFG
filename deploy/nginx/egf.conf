# Nginx site configuration for the EGF website.
# Copy to /etc/nginx/sites-available/egf.conf, symlink into sites-enabled,
# then run certbot to add HTTPS (see README.md).

server {
    listen 80;
    listen [::]:80;
    server_name egyptgasfittings.com www.egyptgasfittings.com;

    # Admin image uploads (Next.js limit is 12 MB).
    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # The public host must reach Next.js for Server Action origin checks.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
